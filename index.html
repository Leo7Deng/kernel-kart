<style>
/* the boot screen (js/boot.js fills its bar and fades it into the title). Its own styles, here and only here, so it
   shows before any script or stylesheet of the game's: the Classic Flat colours, Bungee and Fredoka when they've loaded */
#kk-boot{--p:.03;position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#171443,#0b0a24);color:#f6f5ff;font:600 16px/1.3 Fredoka,"Trebuchet MS",system-ui,sans-serif;text-align:center;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:default;transition:opacity .35s ease,visibility 0s linear .35s}
#kk-boot.out{opacity:0;visibility:hidden;pointer-events:none}
#kk-boot .kb-logo{display:block;width:min(440px,78vw);height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
#kk-boot .kb-road{position:relative;width:min(340px,70vw);height:14px;margin:52px 0 6px;border-radius:999px;background:#0d0b2b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
#kk-boot .kb-fill{position:absolute;inset:0;border-radius:999px;overflow:hidden}
#kk-boot .kb-fill::before{content:"";position:absolute;inset:0;background:#ff4d3a;transform-origin:0 50%;transform:scaleX(var(--p));transition:transform .3s cubic-bezier(.2,.8,.2,1);animation:kb-creep 1.5s ease-out both}
#kk-boot .kb-run{position:absolute;left:0;right:0;bottom:100%;height:0;transform:translateX(calc(var(--p) * 100%));transition:transform .3s cubic-bezier(.2,.8,.2,1);animation:kb-creep-x 1.5s ease-out both}
#kk-boot.go .kb-fill::before,#kk-boot.go .kb-run{animation:none}
#kk-boot .kb-kart{position:absolute;left:-40px;bottom:-1px;width:56px;height:35px;animation:kb-bob .28s ease-in-out infinite alternate}
#kk-boot .kb-say{margin:0;min-height:1.3em;font-size:15px;color:#c9c6ec}
#kk-boot .kb-skip{margin:0;font-size:13px;font-weight:500;color:#8f8bbd;animation:kb-in .4s ease 1s both}
@keyframes kb-bob{to{transform:translateY(-2px)}}
@keyframes kb-in{from{opacity:0}}
@keyframes kb-creep{from{transform:scaleX(.03)}to{transform:scaleX(.12)}}
@keyframes kb-creep-x{from{transform:translateX(3%)}to{transform:translateX(12%)}}
@media (prefers-reduced-motion:reduce){#kk-boot,#kk-boot *,#kk-boot *::before{animation:none!important;transition:none!important}}
html.kk-still #kk-boot,html.kk-still #kk-boot *,html.kk-still #kk-boot *::before{animation:none!important;transition:none!important}
@media (max-height:420px){#kk-boot .kb-logo{width:min(300px,60vw)} #kk-boot .kb-road{margin-top:40px}}
</style>
